<html lang="en">

<meta name="theme-color" content="#090a0f">

<style>
:root{
    --bg:#090a0f;
    --panel:#10121a;
    --panel2:#151823;
    --border:#252a38;
    --text:#f5f7fb;
    --muted:#8b93a7;
    --green:#35e58a;
    --red:#ff5d73;
    --yellow:#ffc857;
    --blue:#6ea8ff;
    --purple:#9b7cff;
    --shadow:0 18px 50px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}

.app{
    max-width:1500px;
    margin:auto;
    padding:18px;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:18px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{

    height:42px;
    border-radius:13px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,#9b7cff,#35e58a);
    color:#090a0f;
    font-weight:900;
    box-shadow:0 10px 30px rgba(155,124,255,.2);
}

.brand h1{
    margin:0;
    font-size:19px;
    font-weight:800;
}

.brand small{
    color:var(--muted);
    font-size:10px;
}

.actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

.btn,.select{
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    border-radius:10px;
    padding:9px 12px;
}

.btn:hover,.select:hover{

}

.hero{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:14px;
}

.stat{
    background:linear-gradient(145deg,#11141d,#0d0f16);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    box-shadow:var(--shadow);
}

.stat-label{
    color:var(--muted);
    font-size:11px;
    margin-bottom:8px;
}

.stat-value{

    font-weight:800;
}

.statusbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:10px 0 16px;

    border:1px solid var(--border);

}

.layout{
    display:grid;

.content{

.red{color:var(--red)}

.modal{

<script>
/* =========================================================
   MEMQI PRO — STRONG API ENGINE
   CoinGecko + DexScreener
   Retry + Timeout + Cache + Fallback + Health
   ========================================================= */

const API = {
    COINGECKO: "https://api.coingecko.com/api/v3",
    DEXSCREENER: "https://api.dexscreener.com",

    TIMEOUT: 12000,

    RETRIES: {
        GET: 3,
        SEARCH: 2
    },

    CACHE: {
        MARKET: 90 * 1000,
        DEX: 60 * 1000,
        CONTRACT: 6 * 60 * 60 * 1000,
        LAST_GOOD: 24 * 60 * 60 * 1000
    }
};


/* =========================================================
   STATE
   ========================================================= */

const state = {
    coins: [],
    filtered: [],
    filter: "all",
    tab: "trending",
    page: "market",
    currency: localStorage.getItem("memqi_currency") || "usd",
    lang: localStorage.getItem("memqi_lang") || "en",
    watchlist: JSON.parse(localStorage.getItem("memqi_watchlist") || "[]"),
    portfolio: JSON.parse(localStorage.getItem("memqi_portfolio") || "[]"),
    alerts: JSON.parse(localStorage.getItem("memqi_alerts") || "[]"),
    loading: false,
    lastUpdated: 0
};


const apiHealth = {
    coingecko: {
        online: false,
        lastSuccess: 0,
        lastFailure: 0,
        failures: 0
    },

    dexscreener: {
        online: false,
        lastSuccess: 0,
        lastFailure: 0,
        failures: 0
    }
};


const memoryCache = new Map();
const CACHE_PREFIX = "memqi_api_cache_v4_";


/* =========================================================
   CACHE
   ========================================================= */

function saveCache(key, data) {
    try {
        localStorage.setItem(
            CACHE_PREFIX + key,
            JSON.stringify({
                timestamp: Date.now(),
                data
            })
        );
    } catch(e) {}
}


function loadCache(key, maxAge = Infinity) {
    try {
        const raw = localStorage.getItem(
            CACHE_PREFIX + key
        );

        if (!raw) return null;

        const parsed = JSON.parse(raw);

        if (!parsed?.timestamp) return null;

        const age = Date.now() - parsed.timestamp;

        if (age > maxAge) return null;

        return {
            data: parsed.data,
            timestamp: parsed.timestamp,
            age,
            fresh: true
        };

    } catch(e) {
        return null;
    }
}


function loadAnyCache(key) {
    try {
        const raw = localStorage.getItem(
            CACHE_PREFIX + key
        );

        if (!raw) return null;

        const parsed = JSON.parse(raw);

        if (!parsed?.timestamp) return null;

        return {
            data: parsed.data,
            timestamp: parsed.timestamp,
            age: Date.now() - parsed.timestamp,
            fresh: false
        };

    } catch(e) {
        return null;
    }
}


function memorySet(key, data) {
    if (!key) return;

    memoryCache.set(key, {
        timestamp: Date.now(),
        data
    });
}


function memoryGet(key, maxAge = Infinity) {
    const item = memoryCache.get(key);

    if (!item) return null;

    const age = Date.now() - item.timestamp;

    return {
        data: item.data,
        timestamp: item.timestamp,
        age,
        fresh: age <= maxAge
    };
}


/* =========================================================
   NETWORK
   ========================================================= */

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}


async function fetchWithTimeout(url, timeout = API.TIMEOUT) {

    const controller = new AbortController();

    const timer = setTimeout(
        () => controller.abort(),
        timeout
    );

    try {

        return await fetch(url, {
            method: "GET",
            signal: controller.signal,
            cache: "no-store",
            headers: {
                "Accept": "application/json"
            }
        });

    } finally {

        clearTimeout(timer);

    }
}


function shouldRetry(response, error) {

    if (error) return true;
    if (!response) return true;

    return (
        response.status === 408 ||
        response.status === 425 ||
        response.status === 429 ||
        response.status >= 500
    );
}


function retryDelay(attempt, response) {

    const retryAfter =
        response?.headers?.get("Retry-After");

    if (retryAfter) {

        const seconds = Number(retryAfter);

        if (Number.isFinite(seconds)) {
            return Math.min(
                seconds * 1000,
                15000
            );
        }
    }

    return Math.min(
        700 * Math.pow(2, attempt) +
        Math.floor(Math.random() * 400),
        8000
    );
}


function markSuccess(source) {

    if (!apiHealth[source]) return;

    apiHealth[source].online = true;
    apiHealth[source].lastSuccess = Date.now();
    apiHealth[source].failures = 0;
}


function markFailure(source) {

    if (!apiHealth[source]) return;

    apiHealth[source].online = false;
    apiHealth[source].lastFailure = Date.now();
    apiHealth[source].failures++;
}


/* =========================================================
   GENERIC REQUEST
   ========================================================= */

async function requestJSON(
    url,
    {
        source,
        cacheKeyName = null,
        cacheTTL = 0,
        retries = 3,
        timeout = API.TIMEOUT
    } = {}
) {

    /* MEMORY CACHE */

    if (cacheKeyName && cacheTTL > 0) {

        const mem =
            memoryGet(
                cacheKeyName,
                cacheTTL
            );

        if (mem?.fresh) {

            return {
                ok: true,
                data: mem.data,
                source,
                cached: true,
                stale: false,
                age: mem.age
            };
        }
    }


    /* LOCAL FRESH CACHE */

    if (cacheKeyName && cacheTTL > 0) {

        const cached =
            loadCache(
                cacheKeyName,
                cacheTTL
            );

        if (cached?.data) {

            memorySet(
                cacheKeyName,
                cached.data
            );

            return {
                ok: true,
                data: cached.data,
                source,
                cached: true,
                stale: false,
                age: cached.age
            };
        }
    }


    let lastError = null;
    let lastResponse = null;


    /* LIVE + RETRY */

    for (
        let attempt = 0;
        attempt <= retries;
        attempt++
    ) {

        try {

            const response =
                await fetchWithTimeout(
                    url,
                    timeout
                );

            lastResponse = response;


            if (response.ok) {

                const data =
                    await response.json();

                if (cacheKeyName) {

                    memorySet(
                        cacheKeyName,
                        data
                    );

                    saveCache(
                        cacheKeyName,
                        data
                    );
                }

                markSuccess(source);

                return {
                    ok: true,
                    data,
                    source,
                    cached: false,
                    stale: false,
                    age: 0,
                    status: response.status
                };
            }


            if (
                shouldRetry(
                    response,
                    null
                ) &&
                attempt < retries
            ) {

                await sleep(
                    retryDelay(
                        attempt,
                        response
                    )
                );

                continue;
            }


            lastError =
                new Error(
                    `HTTP ${response.status}`
                );

            break;

        } catch(error) {

            lastError = error;

            if (attempt < retries) {

                await sleep(
                    retryDelay(
                        attempt,
                        lastResponse
                    )
                );

                continue;
            }
        }
    }


    /* STALE FALLBACK */

    markFailure(source);


    if (cacheKeyName) {

        const fallback =
            loadAnyCache(
                cacheKeyName
            );

        if (fallback?.data) {

            memorySet(
                cacheKeyName,
                fallback.data
            );

            return {
                ok: true,
                data: fallback.data,
                source,
                cached: true,
                stale: true,
                age: fallback.age,
                error:
                    lastError?.message ||
                    "Live API unavailable"
            };
        }
    }


    return {
        ok: false,
        data: null,
        source,
        cached: false,
        stale: true,
        age: null,
        error:
            lastError?.message ||
            `HTTP ${lastResponse?.status || "unknown"}`
    };
}


/* =========================================================
   COINGECKO
   ========================================================= */

async function cgMarkets() {

    const url =
        `${API.COINGECKO}/coins/markets` +
        `?vs_currency=usd` +
        `&category=meme-token` +
        `&order=market_cap_desc` +
        `&per_page=250` +
        `&page=1` +
        `&sparkline=false` +
        `&price_change_percentage=1h,24h,7d`;


    return requestJSON(url, {

        source: "coingecko",

        cacheKeyName:
            "cg_markets_usd_250",

        cacheTTL:
            API.CACHE.MARKET,

        retries: 3,

        timeout: API.TIMEOUT
    });
}


async function cgSearch(query) {

    if (!query) return null;

    return requestJSON(
        `${API.COINGECKO}/search?query=${encodeURIComponent(query)}`,
        {
            source: "coingecko",
            cacheKeyName:
                `cg_search_${query.toLowerCase()}`,
            cacheTTL:
                10 * 60 * 1000,
            retries: 2,
            timeout: 10000
        }
    );
}


async function cgCoinDetail(id) {

    if (!id) return null;

    return requestJSON(
        `${API.COINGECKO}/coins/${encodeURIComponent(id)}` +
        `?localization=false` +
        `&tickers=false` +
        `&market_data=true` +
        `&community_data=false` +
        `&developer_data=false`,
        {
            source: "coingecko",
            cacheKeyName:
                `cg_coin_${id}`,
            cacheTTL:
                5 * 60 * 1000,
            retries: 2,
            timeout: 12000
        }
    );
}


/* =========================================================
   DEXSCREENER
   ========================================================= */

async function dsSearch(query) {

    if (!query) return null;

    return requestJSON(
        `${API.DEXSCREENER}/latest/dex/search?q=${encodeURIComponent(query)}`,
        {
            source: "dexscreener",
            cacheKeyName:
                `ds_search_${query.toLowerCase()}`,
            cacheTTL:
                API.CACHE.DEX,
            retries: 3,
            timeout: 10000
        }
    );
}


async function dsToken(chain, address) {

    if (!chain || !address) return null;

    return requestJSON(
        `${API.DEXSCREENER}/tokens/v1/${encodeURIComponent(chain)}/${encodeURIComponent(address)}`,
        {
            source: "dexscreener",
            cacheKeyName:
                `ds_token_${chain}_${address}`,
            cacheTTL:
                API.CACHE.DEX,
            retries: 3,
            timeout: 10000
        }
    );
}


async function dsLatestProfiles() {

    return requestJSON(
        `${API.DEXSCREENER}/token-profiles/latest/v1`,
        {
            source: "dexscreener",
            cacheKeyName:
                "ds_latest_profiles",
            cacheTTL:
                API.CACHE.DEX,
            retries: 3,
            timeout: 10000
        }
    );
}


async function dsLatestBoosts() {

    return requestJSON(
        `${API.DEXSCREENER}/token-boosts/latest/v1`,
        {
            source: "dexscreener",
            cacheKeyName:
                "ds_latest_boosts",
            cacheTTL:
                API.CACHE.DEX,
            retries: 3,
            timeout: 10000
        }
    );
}


async function dsTopBoosts() {

    return requestJSON(
        `${API.DEXSCREENER}/token-boosts/top/v1`,
        {
            source: "dexscreener",
            cacheKeyName:

/* =========================================================
   DEX DISCOVERY
   ========================================================= */

const MEME_TERMS = [
    "meme",
    "doge",
    "shib",
    "pepe",
    "bonk",
    "inu",
    "frog",
    "cat"
];


async function discoverDexMemes() {

    const all = [];


    const [
        profiles,
        latestBoosts,
        topBoosts
    ] = await Promise.allSettled([

        dsLatestProfiles(),
        dsLatestBoosts(),
        dsTopBoosts()

    ]);


    for (
        const result of [
            profiles,
            latestBoosts,
            topBoosts
        ]
    ) {

        if (
            result.status === "fulfilled" &&
            result.value?.ok
        ) {

            const data =
                result.value.data;

            if (Array.isArray(data)) {
                all.push(...data);
            }
        }
    }


    const searches =
        await Promise.allSettled(
            MEME_TERMS.map(
                term => dsSearch(term)
            )
        );


    for (const result of searches) {

        if (
            result.status === "fulfilled" &&
            result.value?.ok
        ) {

            const pairs =
                result.value.data?.pairs;

            if (Array.isArray(pairs)) {
                all.push(...pairs);
            }
        }
    }


    return dedupeDexPairs(all);
}


function dedupeDexPairs(items) {

    const map = new Map();


    for (const item of items) {

        if (!item) continue;

        const address =
            item.baseToken?.address;

        const chain =
            item.chainId;

        if (!address || !chain) continue;


        const key =
            `${chain}:${address}`.toLowerCase();


        const existing =
            map.get(key);


        if (!existing) {

            map.set(key, item);

        } else {

            const oldLiquidity =
                Number(
                    existing?.liquidity?.usd || 0
                );

            const newLiquidity =
                Number(
                    item?.liquidity?.usd || 0
                );

            if (
                newLiquidity >
                oldLiquidity
            ) {
                map.set(key, item);
            }
        }
    }


    return [...map.values()];
}


/* =========================================================
   NORMALIZE
   ========================================================= */

function normalizeChain(chain) {

    const x =
        String(chain || "")
            .toLowerCase()
            .trim();


    const map = {
        eth:"ethereum",
        ethereum:"ethereum",
        sol:"solana",
        solana:"solana",
        bsc:"bsc",
        binance:"bsc",
        "binance-smart-chain":"bsc",
        base:"base",
        arb:"arbitrum",
        arbitrum:"arbitrum",
        "arbitrum-one":"arbitrum",
        polygon:"polygon",
        matic:"polygon",
        optimism:"optimism",
        avax:"avalanche",
        avalanche:"avalanche",
        fantom:"fantom",
        sui:"sui",
        ton:"ton"
    };


    return map[x] || x;
}


function normalizeText(value) {

    return String(value || "")
        .toLowerCase()
        .trim()
        .replace(/\s+/g," ")
        .replace(/[^a-z0-9$ ._-]/g,"");
}


/* =========================================================
   DEX MATCHING
   ========================================================= */

function findDexMatch(
    pairs,
    coin
) {

    if (!Array.isArray(pairs)) return null;

    const name =
        normalizeText(coin?.name);

    const symbol =
        normalizeText(coin?.symbol);


    const candidates =
        pairs.filter(pair => {

            const token =
                pair?.baseToken;

            if (!token?.address) return false;

            return true;
        });


    let best = null;
    let bestScore = -Infinity;


    for (const pair of candidates) {

        const token =
            pair.baseToken;

        const tokenName =
            normalizeText(token.name);

        const tokenSymbol =
            normalizeText(token.symbol);


        let score = 0;


        if (
            symbol &&
            tokenSymbol === symbol
        ) {
            score += 60;
        }


        if (
            name &&
            tokenName === name
        ) {
            score += 60;
        }


        if (
            name &&
            tokenName.includes(name)
        ) {
            score += 20;
        }


        if (
            symbol &&
            tokenSymbol.includes(symbol)
        ) {
            score += 20;
        }


        const liquidity =
            Number(
                pair?.liquidity?.usd || 0
            );

        const volume =
            Number(
                pair?.volume?.h24 || 0
            );


        score += Math.min(
            Math.log10(
                Math.max(liquidity,1)
            ) * 2,
            20
        );


        score += Math.min(
            Math.log10(
                Math.max(volume,1)
            ),
            10
        );


        if (score > bestScore) {

            bestScore = score;
            best = pair;
        }
    }


    return best;
}


/* =========================================================
   DEX NORMALIZATION
   ========================================================= */

function normalizeDexPair(pair) {

    if (!pair) return null;

    const token =
        pair.baseToken || {};


    return {

        address:
            token.address || null,

        chain:
            pair.chainId || null,

        name:
            token.name || null,

        symbol:
            token.symbol || null,

        pairAddress:
            pair.pairAddress || null,

        dex:
            pair.dexId || null,

        url:
            pair.url || null,

        priceUsd:

        liquidityUsd:
            Number(
                pair?.liquidity?.usd || 0
            ),

        volume24h:
            Number(
                pair?.volume?.h24 || 0
            ),

        priceChange1h:
            Number(
                pair?.priceChange?.h1 || 0
            ),

        priceChange6h:
            Number(
                pair?.priceChange?.h6 || 0
            ),

        priceChange24h:
            Number(
                pair?.priceChange?.h24 || 0
            ),

        buys24h:

            ),

            ),

        pairCreatedAt:

        fdv:

        boosts:
            Number(
                pair?.boosts?.active || 0
            )
    };
}


/* =========================================================
   COINGECKO NORMALIZATION
   ========================================================= */

function normalizeCoinGeckoCoin(coin) {

    const platforms =
        coin.platforms || {};


    let contractAddress = null;
    let contractChain = null;


    const priority = [
        ["solana","solana"],
        ["ethereum","ethereum"],
        ["base","base"],
        ["binance-smart-chain","bsc"],
        ["arbitrum-one","arbitrum"],
        ["polygon-pos","polygon"],
        ["optimistic-ethereum","optimism"],
        ["avalanche","avalanche"],
        ["fantom","fantom"]
    ];


    for (
        const [platform,chain]
        of priority
    ) {

        const address =
            platforms[platform];

        if (address) {

            contractAddress =
                address;

            contractChain =
                chain;

            break;
        }
    }


    return {
        ...coin,

        contractAddress,

        contractChain,

        contractSource:
            contractAddress
                ? "coingecko"
                : null,

        dex: null,

        dataSource:
            "coingecko"
    };
}


/* =========================================================
   MERGE
   ========================================================= */

function mergeSources(
    cgCoins,
    dexPairs
) {

    const result = [];
    const used = new Set();


    /* CoinGecko */

    for (const raw of cgCoins) {

        const coin =
            normalizeCoinGeckoCoin(raw);


        const pair =
            findDexMatch(
                dexPairs,
                coin
            );


        if (pair) {

            const dex =
                normalizeDexPair(pair);


            if (dex?.address) {

                coin.dex = dex;

                if (!coin.contractAddress) {

                    coin.contractAddress =
                        dex.address;

                    coin.contractChain =
                        dex.chain;

                    coin.contractSource =
                        "dexscreener";
                }


                used.add(
                    `${dex.chain}:${dex.address}`
                        .toLowerCase()
                );
            }
        }


        coin.dataSource =
            coin.dex
                ? "coingecko+dexscreener"
                : "coingecko";


        result.push(coin);
    }


    /* Dex-only tokens */

    for (const pair of dexPairs) {

        const dex =
            normalizeDexPair(pair);

        if (!dex?.address) continue;


        const key =
            `${dex.chain}:${dex.address}`
                .toLowerCase();


        if (used.has(key)) continue;


        if (
            !looksLikeMeme(
                dex.name,
                dex.symbol
            )
        ) {
            continue;
        }


        result.push({

            id:
                `dex-${dex.chain}-${dex.address}`,

            name:
                dex.name || "Unknown",

            symbol:
                dex.symbol || "",

            image:
                null,

            current_price:
                dex.priceUsd,

            market_cap:
                dex.marketCap,

            total_volume:
                dex.volume24h,

            price_change_percentage_24h:
                dex.priceChange24h,

            price_change_percentage_1h_in_currency:
                dex.priceChange1h,

            price_change_percentage_7d_in_currency:
                0,

            contractAddress:
                dex.address,

            contractChain:
                dex.chain,

            contractSource:
                "dexscreener",

            dex,

            dataSource:
                "dexscreener",

            isDexOnly:
                true
        });
    }


    return result;
}


function looksLikeMeme(name,symbol) {

    const text =
        `${name || ""} ${symbol || ""}`
            .toLowerCase();


    return [
        "meme",
        "doge",
        "dog",
        "shib",
        "inu",
        "pepe",
        "frog",
        "cat",
        "bonk",
        "wojak",
        "floki",
        "moon",
        "elon",
        "trump",
        "chad",
        "baby",
        "kitty",
        "hamster",
        "goat",
        "penguin"
    ].some(x => text.includes(x));
}


/* =========================================================
   MARKET LOAD
   ========================================================= */

let marketRequestInProgress = false;


async function loadMarket() {

    if (marketRequestInProgress) {
        return null;
    }


    marketRequestInProgress = true;


    try {

        const [
            cgResult,
            dexResult
        ] = await Promise.allSettled([

            cgMarkets(),

            discoverDexMemes()

        ]);


        const cg =
            cgResult.status === "fulfilled"
                ? cgResult.value
                : {
                    ok:false,
                    data:null,
                    cached:false,
                    stale:true
                };


        const dex =
            dexResult.status === "fulfilled"
                ? dexResult.value
                : [];


        const cgCoins =
            cg?.ok &&
            Array.isArray(cg.data)
                ? cg.data
                : [];


        const dexPairs =
            Array.isArray(dex)
                ? dex
                : [];


        const coins =
            mergeSources(
                cgCoins,
                dexPairs
            );


        const cgLive =
            cg?.ok &&
            cg?.cached === false;


        const dexLive =
            apiHealth.dexscreener.online &&
            dexPairs.length > 0;


        let status;


        if (cgLive && dexLive) {

            status = {
                level:"LIVE",
                text:
                    "Live • CoinGecko + DexScreener",
                stale:false
            };

        } else if (cgLive) {

            status = {
                level:"PARTIAL",
                text:
                    "Live • CoinGecko",
                stale:false
            };

        } else if (dexLive) {

            status = {
                level:"PARTIAL",
                text:
                    "Live • DexScreener",
                stale:false
            };

        } else if (cg?.ok && cg?.cached) {

            status = {
                level:"STALE",
                text:
                    "Live API unavailable • cached data shown",
                stale:true
            };

        } else {

            status = {
                level:"STALE",
                text:
                    "Live APIs unavailable",
                stale:true
            };
        }


        return {

            coins,

            status,

            updatedAt:
                Date.now(),

            sourceHealth: {
                coingecko:
                    apiHealth.coingecko.online,
                dexscreener:
                    apiHealth.dexscreener.online
            }

        };

    } finally {

        marketRequestInProgress =
            false;
    }
}

let fxRate = 92000;


async function loadFX() {

    try {

        const response =
            await fetch(
                "https://api.frankfurter.app/latest?from=USD&to=EUR",
                {
                    cache:"no-store"
                }
            );

        if (response.ok) {

            const data =
                await response.json();

            if (
                data?.rates?.EUR
            ) {
                window.MEMQI_EUR =
                    Number(
                        data.rates.EUR
                    );
            }
        }

    } catch(e) {}
}


function formatMoney(value) {

    const number =
        Number(value || 0);


    if (!Number.isFinite(number)) {
        return "—";
    }


    if (state.currency === "irt") {

        const toman =
            number * fxRate / 10;


        if (toman >= 1e12)
            return "₺" +
                (toman/1e12).toFixed(2) +
                "T";

        if (toman >= 1e9)
            return "₺" +
                (toman/1e9).toFixed(2) +
                "B";

        if (toman >= 1e6)
            return "₺" +
                (toman/1e6).toFixed(2) +
                "M";

        if (toman >= 1e3)
            return "₺" +
                (toman/1e3).toFixed(2) +
                "K";

        return "₺" +
            Math.round(toman).toLocaleString();
    }


    if (state.currency === "eur") {

        const eur =
            number *
            (window.MEMQI_EUR || 0.85);

        return formatUSDLike(
            eur,
            "€"
        );
    }


    return formatUSDLike(
        number,
        "$"
    );
}


function formatUSDLike(
    value,
    prefix
) {

    if (value >= 1e12)
        return prefix +
            (value/1e12).toFixed(2) +
            "T";

    if (value >= 1e9)
        return prefix +
            (value/1e9).toFixed(2) +
            "B";

    if (value >= 1e6)
        return prefix +
            (value/1e6).toFixed(2) +
            "M";

    if (value >= 1e3)
        return prefix +
            (value/1e3).toFixed(2) +
            "K";

    if (value < 0.000001)
        return prefix +
            value.toExponential(3);

    if (value < 1)
        return prefix +
            value.toFixed(8);

    return prefix +
        value.toLocaleString(
            undefined,
            {
                maximumFractionDigits:2
            }
        );
}


function formatPrice(value) {

    const n =
        Number(value || 0);

    if (!Number.isFinite(n)) return "—";

    if (n < 0.000001)
        return n.toExponential(3);

    if (n < 0.01)
        return n.toFixed(8);

    if (n < 1)
        return n.toFixed(5);

    return n.toLocaleString(
        undefined,
        {
            maximumFractionDigits:4
        }
    );
}


function formatPercent(value) {

    const n =
        Number(value || 0);

    if (!Number.isFinite(n)) return "—";

    return (
        n >= 0 ? "+" : ""
    ) +
    n.toFixed(2) +
    "%";
}


/* =========================================================
   MEMQI SCORE
   ========================================================= */

function calculateScore(c) {

    const change =
        Number(
            c.price_change_percentage_24h || 0
        );

    const volume =
        Number(
            c.total_volume || 0
        );

    const marketCap =
        Number(
            c.market_cap || 0
        );


    let score = 50;


    if (change > 0)
        score += Math.min(
            change * 1.4,
            18
        );
    else
        score += Math.max(
            change * .7,
            -18
        );


    if (
        marketCap > 0 &&
        volume > 0
    ) {

        const ratio =
            volume / marketCap;

        score += Math.min(
            ratio * 25,
            15
        );
    }


    const dex =
        c.dex;


    if (dex) {

        const liquidity =
            Number(
                dex.liquidityUsd || 0
            );

        const buys =
            Number(
                dex.buys24h || 0
            );

        const sells =
            Number(
                dex.sells24h || 0
            );


        if (liquidity > 100000)
            score += 6;

        else if (liquidity > 25000)
            score += 3;


        if (buys > sells)
            score += 5;
    }


    return Math.max(
        0,
        Math.min(
            100,
            Math.round(score)
        )
    );
}


/* =========================================================
   SORT / FILTER
   ========================================================= */

function sortCoins(coins) {

    const list =
        [...coins];


    if (state.filter === "gainers") {

        list.sort(
            (a,b) =>
                Number(
                    b.price_change_percentage_24h || 0
                ) -
                Number(
                    a.price_change_percentage_24h || 0
                )
        );

    } else if (state.filter === "losers") {

        list.sort(
            (a,b) =>
                Number(
                    a.price_change_percentage_24h || 0
                ) -
                Number(
                    b.price_change_percentage_24h || 0
                )
        );

    } else if (state.filter === "signal") {

        list.sort(
            (a,b) =>
                calculateScore(b) -
                calculateScore(a)
        );

    } else if (state.tab === "momentum") {

        list.sort(
            (a,b) =>
                momentumScore(b) -
                momentumScore(a)
        );

    } else if (state.tab === "liquidity") {

        list.sort(
            (a,b) =>
                Number(
                    b?.dex?.liquidityUsd || 0
                ) -
                Number(
                    a?.dex?.liquidityUsd || 0
                )
        );

    } else if (state.tab === "new") {

        list.sort(
            (a,b) =>
                Number(
                    b?.dex?.pairCreatedAt || 0
                ) -
                Number(
                    a?.dex?.pairCreatedAt || 0
                )
        );

    } else {

        list.sort(
            (a,b) =>
                Number(
                    b.market_cap || 0
                ) -
                Number(
                    a.market_cap || 0
                )
        );
    }


    return list;
}


function momentumScore(c) {

    const h1 =
        Number(
            c?.dex?.priceChange1h ||
            c.price_change_percentage_1h_in_currency ||
            0
        );

    const h24 =
        Number(
            c?.price_change_percentage_24h ||
            0
        );

    const volume =
        Number(
            c.total_volume || 0
        );

    const marketCap =
        Number(
            c.market_cap || 0
        );


    return (
        h1 * 3 +
        h24 +
        (
            marketCap > 0
                ? (volume / marketCap) * 20
                : 0
        )
    );
}

function riskBar(
    name,
    value
) {

    return `
        <div class="risk">

            <div class="risk-head">
                <span>${name}</span>
                <span>${Math.round(value)}%</span>
            </div>

            <div class="bar">
                <i style="width:${Math.max(
                    0,
                    Math.min(100,value)
                )}%"></i>
            </div>

        </div>
    `;
}


function liquidityPercent(
    liquidity,
    marketCap
) {

    liquidity =
        Number(liquidity || 0);

    marketCap =
        Number(marketCap || 0);

    if (!liquidity || !marketCap)
        return 0;

    return Math.min(
        100,
        (liquidity / marketCap) * 1000
    );
}


function volumePercent(
    volume,
    marketCap
) {

    volume =
        Number(volume || 0);

    marketCap =
        Number(marketCap || 0);

    if (!volume || !marketCap)
        return 0;

    return Math.min(
        100,
        (volume / marketCap) * 100
    );
}


/* =========================================================
   CONTRACT COPY
   ========================================================= */

async function copyContract(
    event,
    address
) {

    if (event)
        event.stopPropagation();

    try {

        await navigator.clipboard.writeText(
            address
        );

        alert("Contract address copied.");

    } catch(e) {

        prompt(
            "Copy contract address:",
            address
        );
    }
}


/* =========================================================
   FILTER PIPELINE
   ========================================================= */

function applyFilters() {

    const query =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    let coins =
        [...state.coins];


    if (query) {

        coins =
            coins.filter(c => {

                const text =
                    [
                        c.name,
                        c.symbol,
                        c.id,
                        c.contractAddress
                    ]
                    .join(" ")
                    .toLowerCase();

                return text.includes(
                    query
                );
            });
    }


    state.filtered =
        sortCoins(coins);


    renderMarket();
}


/* =========================================================
   REFRESH
   ========================================================= */

async function refreshMarket() {

    if (state.loading)
        return;


    state.loading = true;


    document.getElementById(
        "pageContent"
    ).innerHTML =
        `<div class="loading">
            Refreshing live market data...
         </div>`;


    const result =
        await loadMarket();


    if (!result) {

        state.loading = false;

        document.getElementById(
            "pageContent"
        ).innerHTML =
            `<div class="empty">
                Unable to load market data.
             </div>`;

        return;
    }


    state.coins =
        result.coins || [];


    state.lastUpdated =
        result.updatedAt;


    renderStats(
        state.coins
    );


    renderStatus(
        result.status,
        result.updatedAt
    );


    applyFilters();


    state.loading = false;


    checkAlerts();
}


/* =========================================================
   AUTO REFRESH
   ========================================================= */

let refreshTimer = null;


function startAutoRefresh() {

    if (refreshTimer)
        clearInterval(
            refreshTimer
        );


    refreshTimer =
        setInterval(
            () => {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    refreshMarket();
                }

            },
            60000
        );
}


/* =========================================================
   WATCHLIST
   ========================================================= */

function toggleWatchlist(id) {

    if (
        state.watchlist.includes(id)
    ) {

        state.watchlist =
            state.watchlist.filter(
                x => x !== id
            );

    } else {

        state.watchlist.push(id);
    }


    localStorage.setItem(
        "memqi_watchlist",
        JSON.stringify(
            state.watchlist
        )
    );


    applyFilters();
}


/* =========================================================
   ALERTS
   ========================================================= */

function checkAlerts() {

    if (!state.alerts.length)
        return;


    for (
        const alert of state.alerts
    ) {

        const coin =
            state.coins.find(
                c =>
                    c.id === alert.id
            );


        if (!coin) continue;


        const price =
            Number(
                coin.current_price || 0
            );


        if (
            alert.above &&
            price >= Number(alert.above)
        ) {

            notify(
                `${coin.name} reached target price`
            );

        }

    }
}


function notify(message) {

    if (
        "Notification" in window &&
        Notification.permission ===
        "granted"
    ) {

        new Notification(
            "MEMQI Pro",
            {
                body: message
            }
        );

    } else {

        console.log(
            "MEMQI Alert:",
            message
        );
    }
}

/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function escapeJs(value) {

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/\n/g,"\\n")
        .replace(/\r/g,"\\r");
}


function shortAddress(address) {

    if (!address) return "—";

    if (address.length <= 14)
        return address;

    return (
        address.slice(0,6) +
        "..." +
        address.slice(-6)
    );
}
