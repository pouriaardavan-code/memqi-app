<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEMQI — Meme Coin Intelligence</title>
<style>
:root{
  --bg:#080a0b; --panel:#111415; --panel2:#151819; --line:#262a2b;
  --text:#f4f6f5; --muted:#8c9392; --green:#35e65c; --red:#ff4f5f;
  --yellow:#f4c84b; --shadow:0 18px 50px rgba(0,0,0,.28);
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 50% -10%,#162017 0,#080a0b 34%);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}
.app{max-width:1180px;margin:auto;padding:15px 12px 40px}
.top{display:flex;align-items:center;gap:12px;padding:8px 0 15px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px}
.logo{width:30px;height:30px;border:2px solid var(--green);border-radius:50%;background:var(--green)}
.brand span{color:var(--green)}.spacer{flex:1}
.market{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:20px}
.market .cell{background:#111415;padding:15px}
.label{color:#929897;font-size:11px;font-weight:700}.big{font-size:20px;font-weight:800;margin:6px 0 4px}.up{color:var(--green);font-weight:700;font-size:12px}
.table{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#111415}
.thead,.row{display:grid;grid-template-columns:25px 1.2fr 1fr 1fr 1fr;align-items:center;gap:8px;padding:12px 10px;font-size:13px}
.thead{color:#858c8b;font-size:10px;font-weight:800;border-bottom:1px solid var(--line);text-transform:uppercase}
.row{border-bottom:1px solid var(--line)}.row:last-child{border:0}
.coin{display:flex;align-items:center;gap:8px}.coin img{width:28px;height:28px;border-radius:50%}
.coin strong{display:block;font-size:13px}.coin small{color:#7f8786;font-size:10px}
.up{color:var(--green);font-weight:700}.down{color:var(--red);font-weight:700}
.score{border:1px solid var(--green);color:#c8ffd1;border-radius:6px;padding:3px 6px;font-weight:800;font-size:11px;text-align:center;width:fit-content}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo"></div><span>MEM</span><b>QI</b></div>
    <div class="spacer"></div>
  </header>

  <section class="market">
    <div class="cell">
      <div class="label">MEME MARKET CAP</div>
      <div class="big" id="totalCap">Loading...</div>
      <div class="up">Live Data</div>
    </div>
    <div class="cell">
      <div class="label">24H VOLUME</div>
      <div class="big" id="totalVol">Loading...</div>
      <div class="up">CoinGecko API</div>
    </div>
  </section>

  <section>
    <div class="table">
      <div class="thead">
        <div>#</div><div>Coin</div><div>Price</div><div>24H %</div><div>M. Cap</div>
      </div>
      <div id="coinRows"></div>
    </div>
  </section>
</div>

<script>
const API_URL = 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=dogecoin,shiba-inu,pepe,bonk,dogwifhat,floki,mew&order=market_cap_desc&sparkline=false&price_change_percentage=24h';

async function fetchCryptoData() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    
    let totalCap = 0;
    let totalVol = 0;
    const container = document.getElementById('coinRows');
    container.innerHTML = '';

    data.forEach((coin, i) => {
      totalCap += coin.market_cap;
      totalVol += coin.total_volume;

      const changeClass = coin.price_change_percentage_24h >= 0 ? 'up' : 'down';
      const changeSign = coin.price_change_percentage_24h >= 0 ? '+' : '';

      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <div>${i + 1}</div>
        <div class="coin">
          <img src="${coin.image}">
          <div>
            <strong>${coin.name}</strong>
            <small>${coin.symbol.toUpperCase()}</small>
          </div>
        </div>
        <div>$${coin.current_price < 1 ? coin.current_price.toFixed(6) : coin.current_price.toLocaleString()}</div>
        <div class="${changeClass}">${changeSign}${coin.price_change_percentage_24h.toFixed(2)}%</div>
        <div>$${(coin.market_cap / 1e9).toFixed(2)}B</div>
      `;
      container.appendChild(row);
    });

    document.getElementById('totalCap').textContent = '$' + (totalCap / 1e9).toFixed(2) + 'B';
    document.getElementById('totalVol').textContent = '$' + (totalVol / 1e9).toFixed(2) + 'B';

  } catch (err) {
    console.error('API Error:', err);
  }
}

fetchCryptoData();
setInterval(fetchCryptoData, 30000);
</script>
</body>
</html>
