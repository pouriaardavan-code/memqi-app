<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMQI Pro | داشبورد هوشمند و چندشبکه‌ای تحلیل میم‌کوین‌ها</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            glow: 'rgba(16, 185, 129, 0.2)',
                        },
                        dark: {
                            base: '#030712',
                            card: 'rgba(15, 23, 42, 0.7)',
                            panel: 'rgba(30, 41, 59, 0.5)',
                            border: '#1e293b'
                        }
                    },
                    fontFamily: { 
                        sans: ['Plus Jakarta Sans', 'Vazirmatn', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', 'Vazirmatn', sans-serif; 
            background-color: #030712; 
            color: #f3f4f6;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.07) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .cyber-glass { 
            background: rgba(15, 23, 42, 0.65); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }
        .cyber-glass:hover {
            border-color: rgba(52, 211, 153, 0.3);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.15);
        }
        .glass-input { 
            background: rgba(3, 7, 18, 0.7); 
            border: 1px solid #1e293b; 
            transition: all 0.3s ease;
        }
        .glass-input:focus { 
            border-color: #10b981; 
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
            outline: none; 
        }
        /* Chain Selector Styles */
        .chain-pill {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #1e293b;
            color: #94a3b8;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .chain-pill:hover, .chain-pill.active {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.5);
            color: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #030712; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 99px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #10b981; }
    </style>
</head>
<body class="custom-scrollbar min-h-screen flex flex-col selection:bg-cyber-500 selection:text-black">

    <!-- Top Navigation Header -->
    <header class="cyber-glass sticky top-0 z-50 px-4 lg:px-8 py-3.5 border-b border-dark-border/50 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="relative flex items-center justify-center">
                <div class="absolute inset-0 bg-cyber-500 blur-md opacity-40 rounded-xl"></div>
                <div class="relative bg-gradient-to-br from-cyber-600 to-emerald-800 p-2.5 rounded-xl shadow-lg flex items-center justify-center">
                    <i class="fa-solid fa-radar text-xl text-black"></i>
                </div>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-300 bg-clip-text text-transparent">MEMQI Pro</h1>
                    <span class="bg-cyber-500/10 text-emerald-400 text-[10px] font-bold px-2.5 py-0.5 rounded-full border border-cyber-500/30 flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        ALL CHAINS
                    </span>
                </div>
            </div>
        </div>

        <!-- Contract Address Search Bar (Smart API) -->
        <div class="flex-1 max-w-xl mx-6 hidden md:block">
            <div class="relative flex items-center">
                <i class="fa-solid fa-magnifying-glass absolute ltr:left-3.5 rtl:right-3.5 text-slate-500 text-sm"></i>
                <input type="text" id="contractSearch" data-i18n-placeholder="searchPlaceholder" placeholder="جستجوی کانترکت توکن (Solana, ETH, Base, BSC, ...)..." 
                       class="glass-input w-full ltr:pl-10 ltr:pr-24 rtl:pr-10 rtl:pl-24 py-2.5 rounded-xl text-xs text-slate-200 placeholder-slate-500 font-mono">
                <button onclick="searchContract()" id="searchBtn" data-i18n="searchBtn" class="absolute ltr:right-1.5 rtl:left-1.5 bg-gradient-to-r from-cyber-500 to-emerald-600 hover:from-emerald-400 hover:to-cyber-500 text-black font-extrabold text-xs px-4 py-1.5 rounded-lg transition shadow-lg shadow-cyber-500/20">
                    Analyze
                </button>
            </div>
        </div>

        <!-- Utilities -->
        <div class="flex items-center gap-3">
            <button onclick="toggleLanguage()" class="bg-dark-panel hover:bg-slate-800 border border-dark-border text-xs text-emerald-400 font-bold px-3 py-2 rounded-xl transition flex items-center gap-2">
                <i class="fa-solid fa-globe text-slate-400"></i>
                <span id="langLabel">FA</span>
            </button>
        </div>
    </header>

    <!-- Smart Chain Selector (New Feature) -->
    <div class="p-4 bg-dark-base border-b border-dark-border/80">
        <div class="flex items-center gap-2.5 pb-2 overflow-x-auto custom-scrollbar">
            <button class="chain-pill active px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 whitespace-nowrap" onclick="filterByChain('all')">
                🔥 All Chains
            </button>
            <button class="chain-pill px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 whitespace-nowrap" onclick="filterByChain('solana')">
                <img src="https://cryptologos.cc/logos/solana-sol-logo.png?v=032" class="w-4 h-4 rounded-full" alt="SOL"> Solana
            </button>
            <button class="chain-pill px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 whitespace-nowrap" onclick="filterByChain('ethereum')">
                <img src="https://cryptologos.cc/logos/ethereum-eth-logo.png?v=032" class="w-4 h-4 rounded-full" alt="ETH"> Ethereum
            </button>
            <button class="chain-pill px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 whitespace-nowrap" onclick="filterByChain('base')">
                <img src="https://pbs.twimg.com/profile_images/1632873130616184833/16_Nafm6_400x400.jpg" class="w-4 h-4 rounded-full" alt="BASE"> Base
            </button>
            <button class="chain-pill px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 whitespace-nowrap" onclick="filterByChain('bnb-chain')">
                <img src="https://cryptologos.cc/logos/bnb-bnb-logo.png?v=032" class="w-4 h-4 rounded-full" alt="BNB"> BNB Chain
            </button>
            <button class="chain-pill px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 whitespace-nowrap" onclick="filterByChain('blast')">
                <img src="https://blast.io/images/logos/blast_logo_yellow.png" class="w-4 h-4 rounded-full" alt="BLAST"> Blast
            </button>
            <button class="chain-pill px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 whitespace-nowrap" onclick="filterByChain('avalanche')">
                <img src="https://cryptologos.cc/logos/avalanche-avax-logo.png?v=032" class="w-4 h-4 rounded-full" alt="AVAX"> Avalanche
            </button>
        </div>
    </div>

    <!-- ... [Rest of the existing HTML layout remains same] ... -->

    <!-- i18n & App Logic Scripts -->
    <script>
        let currentLang = 'en';
        let currentChain = 'all'; // Default: All Chains
        let mainChartInstance = null;

        // Chain Logos
        const chainLogos = {
            "eth": "https://cryptologos.cc/logos/ethereum-eth-logo.png?v=032",
            "solana": "https://cryptologos.cc/logos/solana-sol-logo.png?v=032",
            "base": "https://pbs.twimg.com/profile_images/1632873130616184833/16_Nafm6_400x400.jpg",
            "bsc": "https://cryptologos.cc/logos/bnb-bnb-logo.png?v=032",
            "polygon": "https://cryptologos.cc/logos/polygon-matic-logo.png?v=032",
            "arbitrum": "https://cryptologos.cc/logos/arbitrum-arb-logo.png?v=032",
            "blast": "https://blast.io/images/logos/blast_logo_yellow.png",
            "avalanche": "https://cryptologos.cc/logos/avalanche-avax-logo.png?v=032"
        };

        // NEW: Handle Chain Filtering
        function filterByChain(chain) {
            currentChain = chain;
            
            // Update active state in UI
            document.querySelectorAll('.chain-pill').forEach(pill => {
                pill.classList.remove('active');
            });
            event.target.classList.add('active');

            console.log(`Filtering by chain: ${currentChain}`);
            fetchTrendingMemesFromCoinGecko(); // Refresh trending list with chain filter
        }

        // UPDATED: Fetch Live Trending Memes (Synced with Chain Selector)
        async function fetchTrendingMemesFromCoinGecko() {
            const tbody = document.getElementById("tokenTableBody");
            try {
                // Construct API URL based on selected chain category
                let apiUrl = 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&category=meme-token&order=market_cap_desc&per_page=10&page=1&sparkline=false';
                
                // For a truly multi-chain experience, you'd want to filter by the ecosystem if possible.
                // Fallback: If "all" is selected, use the meme-token category. Otherwise, we simulate specific chain trends for the fallback contracts.
                
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("API rate limit or network issue");

                const tokens = await response.json();
                tbody.innerHTML = "";

                let displayedIndex = 0;
                tokens.forEach((t) => {
                    // Simulation fallback for multi-chain contracts (In production, replace with real data lookup)
                    let tokenData = { address: "0x...", chain: "eth" };
                    
                    if (t.id === 'pepe') tokenData = { address: "0x6982508145454Ce325dDbE47a25d4ec3d2311933", chain: "eth" };
                    else if (t.id === 'dogwifhat') tokenData = { address: "EKpQGS2XM1VMvA3C3aFm324634643642346", chain: "solana" };
                    else if (t.id === 'brett') tokenData = { address: "0x532f27101965dd16442E59d40670FaF5eBB142E4", chain: "base" };
                    // ... More fallbacks
                    
                    // Filter logic for simulation
                    if (currentChain !== 'all' && tokenData.chain !== currentChain && currentChain !== 'bnb-chain') {
                        return; // Skip if it doesn't match selected chain
                    }

                    const isPositive = t.price_change_percentage_24h >= 0;
                    const priceFormatted = t.current_price < 0.0001 ? t.current_price.toExponential(3) : `$${t.current_price.toLocaleString()}`;
                    const rawContract = tokenData.address;
                    const formattedContract = rawContract.length > 10 ? `${rawContract.substring(0, 6)}...${rawContract.substring(rawContract.length - 4)}` : rawContract;
                    const chainLogo = chainLogos[tokenData.chain] || chainLogos['eth'];

                    tbody.innerHTML += `
                        <tr onclick="selectTokenRow('${rawContract}', '${t.name}', '${t.symbol}', ${t.current_price}, '${tokenData.chain}')" class="hover:bg-slate-800/60 transition cursor-pointer group">
                            <td class="p-4 text-center font-mono font-bold text-slate-500 group-hover:text-emerald-400">${displayedIndex + 1}</td>
                            <td class="p-4 font-bold text-slate-100 flex items-center gap-3">
                                <img src="${t.image}" class="w-7 h-7 rounded-full shadow-md" alt="${t.name}">
                                <div>
                                    <p class="text-xs leading-tight group-hover:text-emerald-400 transition">${t.name}</p>
                                    <span class="text-[10px] text-slate-500 font-normal uppercase flex items-center gap-1">
                                        ${t.symbol} <img src="${chainLogo}" class="w-3.5 h-3.5 rounded-full" alt="Chain">
                                    </span>
                                </div>
                            </td>
                            <td class="p-4 font-mono" onclick="event.stopPropagation()">
                                <div class="flex items-center gap-2 bg-dark-base/90 border border-dark-border px-2.5 py-1 rounded-xl w-max hover:border-emerald-500 Transition">
                                    <span class="text-slate-300 text-[11px]">${formattedContract}</span>
                                    <button onclick="copyContract('${rawContract}')" title="Copy Contract" class="text-slate-500 hover:text-emerald-400 transition">
                                        <i class="fa-regular fa-copy text-xs"></i>
                                    </button>
                                </div>
                            </td>
                            <td class="p-4 font-mono text-slate-200 font-bold">${priceFormatted}</td>
                            <td class="p-4 font-bold ${isPositive ? 'text-emerald-400' : 'text-rose-400'}">
                                ${isPositive ? '+' : ''}${t.price_change_percentage_24h?.toFixed(2)}%
                            </td>
                            <td class="p-4 text-slate-300 font-mono">${t.market_cap ? '$' + (t.market_cap / 1e6).toFixed(1) + 'M' : 'N/A'}</td>
                            <td class="p-4 text-center" onclick="event.stopPropagation()">
                                <div class="flex items-center justify-center gap-1.5">
                                    <button onclick="fetchDexScreenerData('${rawContract}')" class="text-[11px] bg-dark-base border border-dark-border hover:border-emerald-500 text-slate-300 px-2.5 py-1 rounded-lg transition">
                                        ${translations[currentLang].searchBtn}
                                    </button>
                                    <button onclick="buyTokenOnDEX('${tokenData.chain}', '${rawContract}')" class="text-[11px] bg-emerald-500/10 hover:bg-emerald-500 border border-emerald-500/30 text-emerald-400 hover:text-black font-bold px-2.5 py-1 rounded-lg transition">
                                        Swap DEX
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                    displayedIndex++;
                });

                if (displayedIndex === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-amber-400">هیچ میم‌کوین ترندی در شبکه ${currentChain.toUpperCase()} یافت نشد.</td></tr>`;
                }

            } catch (error) {
                console.warn("CoinGecko API Error:", error);
            }
        }

        // ... [Rest of the existing app logic remains same] ...
        // ... [Include calculatePnL, initWhaleRadar functions] ...

        // App Initializer
        window.onload = () => {
            initChart();
            fetchTrendingMemesFromCoinGecko(); // Initial load
            initWhaleRadar();
        };
    </script>
</body>
</html>
